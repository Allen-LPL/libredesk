server {
    listen 80;
    server_name support.liupengliang.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name support.liupengliang.com;

    ssl_certificate /etc/letsencrypt/live/support.liupengliang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.liupengliang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/support_liupengliang_access.log main;
    error_log /var/log/nginx/support_liupengliang_error.log warn;

    client_max_body_size 100M;

    location / {
        proxy_pass http://100.64.0.27:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
