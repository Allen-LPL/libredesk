server {
    listen 80;
    server_name support.liupengliang.com;

    access_log /var/log/nginx/support_liupengliang_access.log main;
    error_log /var/log/nginx/support_liupengliang_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
